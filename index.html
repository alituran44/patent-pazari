    const HAK_TURULERI = [

      {

        satici_id: 'usr_s2',
        satici_sirket: 'BiyoKimya İnovasyon A.Ş.',

        patent_no: 'TR 2023/19082 B',

        model_tipi: 'satis',
        aciklama: 'Beton basınç dayanımını C30 seviyesinden C60 seviyesine çıkaran nano katkı tescili.',
        asgari_beklenti: '3.000.000 TL'
      }
    ];

    function App() {
      const [users, setUsers] = useState(INITIAL_USERS);
      const [listings, setListings] = useState(INITIAL_LISTINGS);
      const [escrows, setEscrows] = useState(INITIAL_ESCROWS);
      const [currentUser, setCurrentUser] = useState(users[0]);
      const [activeTab, setActiveTab] = useState('escrow'); // escrow | listings | admin | guide

      // Escrow Form State
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [paymentAmountInput, setPaymentAmountInput] = useState('500000');

      // Admin Release Notary Document No Input State
      const [releaseNotaryDocInput, setReleaseNotaryDocInput] = useState('');
      const [selectedReleaseTxId, setSelectedReleaseTxId] = useState(null);

      // Charge Escrow Simulation
      const handleChargeEscrowSubmit = (e) => {
        e.preventDefault();
        const total = parseFloat(paymentAmountInput);
        const platform_fee = total * 0.05;
        const seller_payout = total * 0.95;

        const newEscrow = {
          id: 'tx_escrow_' + Date.now(),
          patent_title: 'Beton Dayanıklılığını Artıran Nano-Silika Katkı Formülü',
          buyer_name: currentUser.ad + ' (' + currentUser.sirket_adi + ')',
          seller_name: 'Ayşe Kara (BiyoKimya İnovasyon A.Ş.)',
          seller_iban: 'TR33 0006 2000 0000 0000 0000 02',
          total_amount_try: total,
          commission_rate: 0.05,
          platform_fee_try: platform_fee,
          seller_payout_try: seller_payout,
          status: 'in_escrow',
          payment_transaction_id: 'iyzi_pay_' + Math.random().toString(36).substring(2, 9),
          notary_doc_no: null,
          created_at: new Date().toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' })
        };

        setEscrows([newEscrow, ...escrows]);
        setShowPaymentModal(false);
        alert(`✅ ÖDEME ALINDI VE HAVUZDA BLOKE EDİLDİ!\nToplam: ${total.toLocaleString()} TL\nParanız Noter devri tamamlanana kadar Iyzico Güvenli Havuzunda saklanacaktır.`);
      };

      // Admin Release Escrow Atomic Payout Simulation
      const handleAdminReleaseSubmit = () => {
        if (!releaseNotaryDocInput.trim()) return alert('Lütfen resmi Noter Devir Sözleşmesi Belge Numarasını giriniz.');

        const updatedEscrows = escrows.map(tx => {
          if (tx.id === selectedReleaseTxId) {
            return {
              ...tx,
              status: 'released',
              notary_doc_no: releaseNotaryDocInput,
              released_at: new Date().toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' })
            };
          }
          return tx;
        });

        setEscrows(updatedEscrows);
        const txObj = escrows.find(t => t.id === selectedReleaseTxId);
        alert(`🎉 ATOMIC TRANSACTION SUCCESS & COMMITTED!\nNoter Belge No: ${releaseNotaryDocInput}\n\nKesilen Platform Komisyonu (%5): ${txObj.platform_fee_try.toLocaleString()} TL\nSatıcının IBAN Hesabına Aktarılan Tutar (%95): ${txObj.seller_payout_try.toLocaleString()} TL`);

        setReleaseNotaryDocInput('');
      };

                  </button>
                ))}
              </div>

                </div>

                  </div>
                  <div className="space-y-1 border-l-2 border-amber-500 pl-3">
                    <span className="font-bold text-amber-600 block">2. Paranın Havuzda Blokesi</span>

                  </div>
                  <div className="space-y-1 border-l-2 border-sky-500 pl-3">
                    <span className="font-bold text-sky-600 block">3. Noter Devir Onayı</span>

                  </div>
                  <div className="space-y-1 border-l-2 border-emerald-500 pl-3">
                    <span className="font-bold text-emerald-600 block">4. Otomatik Dağıtım (%5 / %95)</span>

                  </div>

                    <span>Aktif Güvenli Havuz İşlemleri</span>
                    <span className="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded font-bold">
                      %5 Platform Komisyon Modeli
                    </span>
                  </div>

                  <table className="w-full text-left">
                    <thead className="bg-slate-50 text-slate-500 font-semibold border-b">
                      <tr>
                        <th className="p-4">Patent / Buluş Adı</th>
                        <th className="p-4">Alıcı & Satıcı</th>
                        <th className="p-4">Toplam Tutar</th>
                        <th className="p-4">Komisyon (%5)</th>
                        <th className="p-4">Satıcı Hakediş (%95)</th>
                        <th className="p-4">Durum</th>
                        <th className="p-4 text-right">İşlem</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {escrows.map(tx => (
                        <tr key={tx.id} className="hover:bg-slate-50/80">
                          <td className="p-4 font-bold text-slate-900 max-w-xs">{tx.patent_title}</td>
                          <td className="p-4 space-y-0.5">
                            <div className="text-slate-800 font-semibold">Alıcı: {tx.buyer_name}</div>
                            <div className="text-slate-500 text-[11px]">Satıcı: {tx.seller_name}</div>
                            <div className="text-[10px] text-mono text-slate-400">IBAN: {tx.seller_iban}</div>
                          </td>
                          <td className="p-4 font-display font-extrabold text-slate-900 text-sm">
                            {tx.total_amount_try.toLocaleString()} TL
                          </td>
                          <td className="p-4 text-amber-700 font-bold">
                            {tx.platform_fee_try.toLocaleString()} TL
                          </td>
                          <td className="p-4 text-emerald-700 font-extrabold text-sm">
                            {tx.seller_payout_try.toLocaleString()} TL
                          </td>

                            {tx.status === 'in_escrow' && (

                                <Icon name="lock" className="w-3.5 h-3.5" />

                              </span>

                              <button

                              >

                              </button>
                            )}

                              <div className="text-[10px] text-slate-400 font-mono">
                                Noter Belge: {tx.notary_doc_no}
                              </div>
                            )}

                        </tr>
                      ))}

            {activeTab === 'listings' && (
              <div className="space-y-6">
                <div className="border-b pb-4">
                  <h1 className="font-display text-2xl font-bold text-slate-900">Sınai Mülkiyet İlan Portföyü</h1>
                </div>

                <div className="grid md:grid-cols-2 gap-6">
                  {listings.map(l => (
                    <div key={l.id} className="bg-white p-6 rounded-2xl border space-y-3 shadow-sm">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-mono text-slate-400">{l.patent_no}</span>
                        <span className="bg-brand-50 text-brand-700 font-bold px-2 py-0.5 rounded">IPC {l.ipc_ana}</span>
                      </div>
                      <h3 className="font-bold text-slate-900 text-base">{l.baslik}</h3>
                      <p className="text-xs text-slate-600">{l.aciklama}</p>
                      
                      <div className="pt-2 border-t flex justify-between items-center text-xs">
                        <span className="font-bold text-emerald-700">Değer: {l.asgari_beklenti}</span>
                        <button
                          onClick={() => {
                            setActiveTab('escrow');
                            setShowPaymentModal(true);
                          }}
                          className="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1"
                        >
                          <Icon name="creditCard" className="w-3.5 h-3.5" />
                          <span>Güvenli Ödeme Yap</span>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: ADMIN NOTER DAĞITIM ONAYI */}
            {activeTab === 'admin' && (
              <div className="max-w-4xl mx-auto space-y-6 text-xs">
                <div className="border-b pb-4">
                  <h1 className="font-display text-2xl font-bold text-slate-900">Admin Finans & Noter Dağıtım Masası</h1>
                  <p className="text-slate-500">Noter devri gerçekleşmiş ihalelerin %5 platform komisyonunu kesip satıcıya aktarma onay alanı.</p>
                </div>

                <div className="bg-slate-900 text-slate-200 p-6 rounded-2xl space-y-3">
                  <h4 className="font-bold text-white text-sm">Finansal Dağıtım Mantığı (Atomic Transaction):</h4>
                  <ul className="list-disc pl-5 space-y-1 text-slate-300">
                    <li>İşlem PostgreSQL veritabanında <strong>`BEGIN ... COMMIT`</strong> bloğu içinde ve <strong>`FOR UPDATE`</strong> kilidiyle çalışır.</li>
                    <li>Toplam tutardan %5 platform komisyonu hesaplanır ve platform ana hesabına aktarılır.</li>
                    <li>Kalan %95 net tutar satıcının sistemde tanımlı IBAN hesabına Iyzico Sub-merchant Payout API ile aktarılır.</li>
                    <li>Ödeme veya banka hatası durumunda veritabanı otomatik <strong>ROLLBACK</strong> yaparak parayı güvencede tutar.</li>
                  </ul>
                </div>
              </div>
            )}

          </main>

          {/* MODAL 1: CHARGE ESCROW (IYZICO PAYMENT SIMULATION) */}
          {showPaymentModal && (
            <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl relative text-xs">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="font-display font-bold text-lg text-slate-900">Güvenli Havuz (Escrow) Ödemesi</h3>
                    <p className="text-slate-500">Iyzico Pazar Yeri Altyapısı İle Parayı Bloke Et</p>
                  </div>
                  <button onClick={() => setShowPaymentModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>

                <form onSubmit={handleChargeEscrowSubmit} className="space-y-4">
                  <div>
                    <label className="block font-semibold mb-1 text-slate-700">Devir / Lisans Tutarı (TL) *</label>
                    <input
                      type="number"
                      required
                      value={paymentAmountInput}
                      onChange={(e) => setPaymentAmountInput(e.target.value)}
                      className="w-full p-2.5 border rounded-lg font-bold text-sm"
                    />
                  </div>

                  <div className="bg-slate-50 p-3 rounded-xl border space-y-1">
                    <div className="flex justify-between text-slate-500">
                      <span>Platform Komisyonu (%5):</span>
                      <strong className="text-amber-700">{(parseFloat(paymentAmountInput || 0) * 0.05).toLocaleString()} TL</strong>
                    </div>
                    <div className="flex justify-between text-slate-500">
                      <span>Satıcıya Aktarılacak Net Tutar (%95):</span>
                      <strong className="text-emerald-700">{(parseFloat(paymentAmountInput || 0) * 0.95).toLocaleString()} TL</strong>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold mb-1 text-slate-700">Kredi Kartı Numarası (Simülasyon)</label>
                    <input type="text" defaultValue="4543 **** **** 1234" className="w-full p-2.5 border rounded-lg bg-slate-50 font-mono" />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowPaymentModal(false)} className="px-4 py-2 border rounded-lg">İptal</button>
                    <button type="submit" className="px-5 py-2 bg-emerald-600 text-white font-bold rounded-lg shadow">Parayı Bloke Et & Öde</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2: ADMIN RELEASE ESCROW WITH NOTARY DOC NO */}
          {selectedReleaseTxId && (
            <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative text-xs">
                <h3 className="font-bold text-lg text-slate-900">Noter Devrini Onayla & Parayı Aktar</h3>
                <p className="text-slate-500">SMK 6769 gereği düzenlenen resmi Noter Devir Sözleşmesi Belge Numarasını giriniz.</p>

                <div>
                  <label className="block font-semibold mb-1 text-slate-700">Noter Devir Belge No *</label>
                  <input
                    type="text"
                    required
                    value={releaseNotaryDocInput}
                    onChange={(e) => setReleaseNotaryDocInput(e.target.value)}
                    placeholder="Örn: NOTER-2024-99812"
                    className="w-full p-2.5 border rounded-lg font-mono font-bold"
                  />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setSelectedReleaseTxId(null)} className="px-4 py-2 border rounded-lg">İptal</button>
                  <button onClick={handleAdminReleaseSubmit} className="px-5 py-2 bg-brand-600 text-white font-bold rounded-lg shadow">Onayla & %95 Payout Aktar</button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 flex justify-between items-center">
              <span>&copy; {new Date().getFullYear()} Patent Pazarı Fintek. Tüm Hakları Saklıdır.</span>
              <span>Iyzico / Stripe Connect Escrow Module</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
