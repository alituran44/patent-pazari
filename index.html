                  <button type="submit" className="w-full bg-brand-700 text-white font-bold py-3 rounded-xl text-sm shadow">İlanı Kaydet</button>
                </form>
              </div>
            )}

            {/* --- SCREEN 3: ESCROW & FINTECH --- */}
            {activeTab === 'escrow' && (
              <div className="bg-white p-8 rounded-2xl border border-slate-200 space-y-6 shadow-sm text-xs">
                <h1 className="font-display font-bold text-2xl text-slate-900 border-b pb-3 flex items-center gap-2">
                  <Icon name="lock" className="w-6 h-6 text-emerald-600" />
                  <span>Iyzico Escrow (Güvenli Havuz) & Noter Devri (%5 Komisyon)</span>
                </h1>
                <p className="text-slate-600 leading-relaxed">
                  Alıcının ödemesi Iyzico Alt-Üye İşyeri havuzunda bloke edilir. SMK 6769 Noter devri gerçekleştiğinde %5 platform komisyonu kesilir ve %95 net tutar satıcının IBAN hesabına otomatik aktarılır.
                </p>
              </div>
            )}

            {/* --- SCREEN 4: GGUF AI ENGINE --- */}
            {activeTab === 'ai_engine' && (
              <div className="bg-white p-8 rounded-2xl border border-slate-200 space-y-6 shadow-sm text-xs">
                <h1 className="font-display font-bold text-2xl text-slate-900 border-b pb-3 flex items-center gap-2">
                  <Icon name="sparkles" className="w-6 h-6 text-brand-600" />
                  <span>Self-Hosted Tencent Hy3 GGUF & pgvector HNSW Engine</span>
                </h1>
                <p className="text-slate-600 leading-relaxed">
                  AWS EC2 Odysseus sunucumuzda çalışan GGUF modeli ile aradığınız teknoloji 1536-boyutlu vektör anlamsal kosinüs benzerliği üzerinden HNSW indeksi ile saniyeler içinde % uyum skoru verir.
                </p>
              </div>
            )}

            {/* --- SCREEN 5: PRICING --- */}
            {activeTab === 'pricing' && (
              <div className="bg-white p-8 rounded-2xl border border-slate-200 space-y-6 shadow-sm text-xs">
                <h1 className="font-display font-bold text-2xl text-slate-900 border-b pb-3">Gelir Modeli & Paketler</h1>
                <div className="grid md:grid-cols-4 gap-4">
                  <div className="p-4 border rounded-xl bg-slate-50 space-y-1"><h3 className="font-bold">Başlangıç</h3><div className="font-display font-bold text-lg text-brand-700">Ücretsiz</div><p>İlk 2 İlan Ücretsiz</p></div>
                  <div className="p-4 border rounded-xl bg-slate-50 space-y-1 border-brand-500"><h3 className="font-bold">Standart</h3><div className="font-display font-bold text-lg text-brand-700">499 TL / ay</div><p>Sınırsız İlan</p></div>
                  <div className="p-4 border rounded-xl bg-slate-50 space-y-1"><h3 className="font-bold">Öne Çıkan</h3><div className="font-display font-bold text-lg text-brand-700">299 TL / ilan</div><p>30 Gün Vitrin</p></div>
                  <div className="p-4 border rounded-xl bg-slate-50 space-y-1"><h3 className="font-bold">Kurumsal</h3><div className="font-display font-bold text-lg text-brand-700">9.999 TL / yıl</div><p>Doğrulanmış Rozet</p></div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL: SUBMIT SOLUTION TO YET2.COM TECH NEED */}
          {selectedTechNeedModal && (
            <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-xl w-full space-y-4 text-xs">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="bg-emerald-100 text-emerald-800 font-bold text-[10px] px-2 py-0.5 rounded">OPEN INNOVATION PROPOSAL</span>
                    <h3 className="font-bold text-base text-slate-900 mt-1">{selectedTechNeedModal.title}</h3>
                  </div>
                  <button onClick={() => setSelectedTechNeedModal(null)} className="text-slate-400 font-bold">✕</button>
                </div>

                {proposalSuccess ? (
                  <div className="bg-emerald-50 border border-emerald-300 p-6 rounded-xl text-center space-y-2">
                    <div className="w-12 h-12 bg-emerald-600 text-white rounded-full flex items-center justify-center mx-auto text-lg font-bold">✓</div>
                    <h4 className="font-bold text-emerald-950 text-sm">Başvurunuz Başarıyla İletildi!</h4>
                    <p className="text-emerald-800 text-xs">Patentiniz ve teknik çözüm belgeniz <strong>{selectedTechNeedModal.client_type}</strong> değerlendirme komitesine aktarılmıştır.</p>
                    <button onClick={() => setSelectedTechNeedModal(null)} className="mt-3 bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg">Kapat</button>
                  </div>
                ) : (
                  <form onSubmit={(e) => { e.preventDefault(); setProposalSuccess(true); }} className="space-y-4">
                    <div className="bg-slate-50 p-3 rounded-xl border space-y-1">
                      <div className="font-semibold text-slate-800">Çağrı Sahibi: {selectedTechNeedModal.client_type}</div>
                      <div className="text-slate-500">Gelişim Aşaması (TRL): {selectedTechNeedModal.trl}</div>
                    </div>

                    <div>
                      <label className="block font-bold mb-1">Mevcut Patentiniz / Buluşunuz Seçin *</label>
                      <select required className="w-full p-2.5 border rounded-lg bg-white font-semibold">
                        <option value="pat_004">TR 2023/19082 B — Beton Dayanıklılığını Artıran Nano-Silika Formülü</option>
                        <option value="pat_005">TR 2024/01482 B — Elektrikli Araçlar İçin Hızlı Şarj Soğutma</option>
                        <option value="pat_001">TR 2024/01124 Y — Toprak Nemi Sensörlü Vana</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold mb-1">Çözüm / Öneri Açıklamanız *</label>
                      <textarea rows="3" required placeholder="Patentinizin bu çağrıdaki teknik kısıtları nasıl çözdüğünü açıklayın..." className="w-full p-2.5 border rounded-lg"></textarea>
                    </div>

                    <div className="flex justify-end gap-2 border-t pt-3">
                      <button type="button" onClick={() => setSelectedTechNeedModal(null)} className="px-4 py-2 border rounded-lg">İptal</button>
                      <button type="submit" className="px-5 py-2 bg-emerald-600 text-white font-bold rounded-lg shadow">Çözümü İlet (Submit Proposal)</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800">
            <div className="max-w-6xl mx-auto px-4 flex justify-between items-center">
              <span>&copy; {new Date().getFullYear()} PatentPazari.com. PatentAuction & yet2.com Open Innovation Hybrid Platform.</span>
              <span>SMK 6769 & Escrow Secured</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
