                              <span className="bg-emerald-500/20 text-emerald-300 font-bold text-[10px] px-2 py-0.5 rounded">OPEN INNOVATION NEED</span>
                              <h4 className="font-bold text-white text-base mt-1">{n.baslik}</h4>
                            </div>
                            <span className="font-bold text-brand-400 font-display text-sm">{n.butce}</span>
                          </div>
                          <p className="text-slate-300">{n.ozet}</p>
                          <div className="pt-2 border-t border-slate-800 flex justify-between items-center text-slate-400">
                            <span>Gelen Çözüm Başvurusu: <strong className="text-emerald-400 font-bold">{n.basvuru_sayisi} Mucit Önerisi</strong></span>
                            <button onClick={() => alert('Gelen mucit başvuruları inceleniyor')} className="bg-brand-600 text-white font-bold px-3 py-1.5 rounded-lg">Başvuruları İncele &raquo;</button>
                          </div>
                        </div>
                      ))}
                    </div>

                  </div>
                )}

                {/* ------------------------------------------------------------------ */}
                {/* C. ADMİN (FİNTEK, TÜRKPATENT & MODERASYON) ÖZEL PANELİ */}
                {/* ------------------------------------------------------------------ */}
                {currentUser.rol === 'admin' && (
                  <div className="space-y-8">
                    
                    {/* STATS */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs">
                      <div className="glass-card p-5 rounded-2xl border space-y-1">
                        <div className="text-slate-400 font-semibold">Bekleyen Sicil Onayı</div>
                        <div className="font-display font-black text-2xl text-amber-400">3 İlan</div>
                      </div>
                      <div className="glass-card p-5 rounded-2xl border space-y-1">
                        <div className="text-slate-400 font-semibold">Havuzda Bloke Bakiye</div>
                        <div className="font-display font-black text-2xl text-emerald-400">₺500.000 TL</div>
                      </div>
                      <div className="glass-card p-5 rounded-2xl border space-y-1">
                        <div className="text-slate-400 font-semibold">Kesilen %5 Platform Komisyonu</div>
                        <div className="font-display font-black text-2xl text-brand-400">₺25.000 TL</div>
                      </div>
                      <div className="glass-card p-5 rounded-2xl border space-y-1">
                        <div className="text-slate-400 font-semibold">Şikayetli İlanlar</div>
                        <div className="font-display font-black text-2xl text-red-400">1 İlan</div>
                      </div>
                    </div>

                    {/* ADMİN ESCROW DAĞITIM & NOTER DEVİR ONAY MASASI */}
                    <div className="glass-card rounded-3xl p-6 sm:p-8 space-y-5 text-xs">
                      <h3 className="font-bold text-white text-base border-b border-slate-800 pb-3">Admin Noter Devir Onayı & Atomic %95 Payout Masası</h3>
                      
                      {INITIAL_ESCROWS.map(tx => (
                        <div key={tx.id} className="p-5 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="font-bold text-emerald-400 text-xs">İyziPay Güvenli Havuzda Bloke: ₺{tx.total_amount.toLocaleString()} TL</span>
                              <h4 className="font-bold text-white text-sm mt-1">{tx.patent_title}</h4>
                            </div>
                            <span className="bg-amber-500/20 text-amber-300 font-bold px-2 py-1 rounded text-[10px]">İnceleme Bekliyor</span>
                          </div>

                          <div className="grid sm:grid-cols-2 gap-2 text-slate-300 bg-slate-950 p-3 rounded-xl">
                            <div>Alıcı: <strong>{tx.buyer_name}</strong></div>
                            <div>Satıcı: <strong>{tx.seller_name}</strong></div>
                            <div>Kesilecek Komisyon (%5): <strong className="text-amber-400">₺{tx.fee.toLocaleString()} TL</strong></div>
                            <div>Satıcı Payout (%95): <strong className="text-emerald-400">₺{tx.payout.toLocaleString()} TL</strong></div>
                          </div>

                          <div className="pt-2 flex justify-between items-center">
                            <span className="text-slate-400">SMK 6769 Noter Devir Belge Teyidi Gereklidir</span>
                            <button
                              onClick={() => { setSelectedEscrowTxId(tx.id); }}
                              className="bg-brand-600 hover:bg-brand-500 text-white font-bold px-4 py-2 rounded-xl shadow"
                            >
                              Noter Devrini Onayla & Payout Aktar &raquo;
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                  </div>
                )}

              </div>
            )}

            {/* ==================================================================== */}
            {/* SCREEN 2: BİRLEŞİK ANA SAYFA */}
            {/* ==================================================================== */}
            {activeTab === 'home' && (
              <div className="space-y-12">
                <div className="text-center space-y-4 max-w-3xl mx-auto pt-4">
                  <div className="inline-flex items-center space-x-2 bg-slate-900 border border-slate-800 rounded-full px-4 py-1.5 text-xs text-brand-400 font-bold">
                    <Icon name="shieldCheck" className="w-4 h-4 text-emerald-400" />
                    <span>yet2.com Açık İnovasyon & PatentAuction Pazaryeri Mimarisi</span>
                  </div>
                  <h1 className="font-display font-black text-4xl sm:text-5xl text-white">
                    Türkiye'nin <span className="gradient-text">Patent & AR-GE</span> Portalı
                  </h1>
                  <p className="text-slate-400 text-xs sm:text-sm leading-relaxed">
                    Kurumsal sanayi ihtiyaçlarıyla tescilli patentleri buluşturuyoruz. Lütfen yukarıdaki "Profil / Rol Değiştir" alanından Satıcı, Alıcı veya Admin panellerine geçiş yapabilirsiniz.
                  </p>
                </div>
              </div>
            )}

          </main>

          {/* AUTH & ROLE PROFILER SELECTION MODAL */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full space-y-5 text-xs shadow-2xl relative">
                <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="font-display font-bold text-lg text-white">Kullanıcı Girişi & Profil Seçimi</h3>
                    <p className="text-slate-400">Test etmek istediğiniz kullanıcı rolünü seçiniz:</p>
                  </div>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 font-bold text-base hover:text-white">✕</button>
                </div>

                <div className="space-y-3">
                  {DEMO_KULLANICILAR.map(u => (
                    <div
                      key={u.id}
                      onClick={() => handleSelectUser(u)}
                      className={`p-4 rounded-2xl border cursor-pointer transition-all flex items-center justify-between ${
                        currentUser.id === u.id ? 'bg-brand-600/20 border-brand-500' : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center space-x-3">
                        <div className={`w-10 h-10 rounded-xl ${u.avatar_bg} text-white font-bold flex items-center justify-center`}>
                          {u.ad.charAt(0)}
                        </div>
                        <div>
                          <div className="font-bold text-white text-sm">{u.ad}</div>
                          <div className="text-slate-400 text-[11px]">{u.sirket}</div>
                        </div>
                      </div>

                      <span className="bg-slate-800 text-brand-300 font-bold px-2.5 py-1 rounded text-[10px] uppercase">
                        {u.rol}
                      </span>
                    </div>
                  ))}
                </div>

                <div className="pt-2 border-t border-slate-800 flex justify-end">
                  <button onClick={() => setShowLoginModal(false)} className="px-4 py-2 border border-slate-700 rounded-xl text-slate-300">İptal</button>
                </div>
              </div>
            </div>
          )}

          {/* ADMIN RELEASE MODAL */}
          {selectedEscrowTxId && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md w-full space-y-4 text-xs shadow-2xl">
                <h3 className="font-display font-bold text-lg text-white">Noter Devrini Onayla & Payout Aktar</h3>
                <p className="text-slate-400">SMK 6769 Noter Devir Belgesi Numarasını Giriniz:</p>
                <input
                  type="text"
                  value={notaryDocInput}
                  onChange={(e) => setNotaryDocInput(e.target.value)}
                  className="w-full p-3 border border-slate-700 rounded-xl bg-slate-950 text-white font-mono font-bold"
                />
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setSelectedEscrowTxId(null)} className="px-4 py-2 border border-slate-700 rounded-xl text-slate-300">İptal</button>
                  <button
                    onClick={() => {
                      alert(`🎉 ATOMIC TRANSACTION SUCCESS!\nNoter No: ${notaryDocInput}\nSatıcı IBAN hesabına ₺475.000 TL %95 net payout aktarıldı. Kesilen Komisyon (%5): ₺25.000 TL`);
                      setSelectedEscrowTxId(null);
                    }}
                    className="px-5 py-2 bg-brand-600 text-white font-bold rounded-xl shadow"
                  >
                    Onayla & %95 Payout Aktar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-950 text-slate-500 text-xs py-8 border-t border-slate-900">
            <div className="max-w-7xl mx-auto px-4 flex justify-between items-center">
              <span>&copy; {new Date().getFullYear()} PatentPazari.com. Rol Bazlı Kullanıcı Panelleri & Fintek Altyapısı.</span>
              <span>SMK 6769 Secured</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
