<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patent Pazarı AI — Self-Hosted GGUF & pgvector Akıllı Eşleştirme</title>
  <meta name="description" content="AWS EC2 Odysseus GGUF Modeli ve PostgreSQL pgvector HNSW Kosinüs Benzerliği İle Otomatik Patent Eşleştirme Platformu">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .font-display { font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />,
        cpu: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M3 9h2m-2 6h2m14-6h2m-2 6h2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />,
        shieldCheck: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
        search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        scale: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m0 0l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 6l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 6l3 9" />,
        lock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />,
        chevronRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />,
        database: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
      };
      return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">{icons[name] || null}</svg>;
    };

    const SAMPLE_PATENTS = [
      {
        id: 'pat_004',
        patent_number: 'TR 2023/19082 B',
        title: 'Beton Dayanıklılığını Artıran Nano-Silika Kimyasal Katkı Formülü',
        abstract: 'Betonda C30 seviyesinden C60 seviyesine basınç dayanımı sağlayan nano-silika katkısı.',
        owner: 'BiyoKimya İnovasyon A.Ş.',
        ipc: 'E (İnşaat)',
        price: '3.000.000 TL',
        default_score: 0.942,
        match_pct: 94.2,
        rationale: 'Tencent Hy3 GGUF Vektör Analizi: Aradığınız C60 nano katkı gereksinimi ile %94.2 kosinüs benzerliği tespit edildi.'
      },
      {
        id: 'pat_005',
        patent_number: 'TR 2024/01482 B',
        title: 'Elektrikli Araçlar İçin Hızlı Şarj Termal Yönetim Sistemi',
        abstract: 'Li-ion bataryaları 35°C sıcaklıkta sabitleyen mikro-kanallı sıvı soğutma manifoldu.',
        owner: 'Yılmaz AR-GE Ltd.',
        ipc: 'F (Makine)',
        price: '750.000 TL + Royalti',
        default_score: 0.887,
        match_pct: 88.7,
        rationale: 'Tencent Hy3 GGUF Vektör Analizi: Batarya soğutma manifoldu metniyle %88.7 anlamsal eşleşme sağlandı.'
      },
      {
        id: 'pat_001',
        patent_number: 'TR 2024/01124 Y',
        title: 'Toprak Nemi Sensörlü Otomatik Sulama Vanası Mekanizması',
        abstract: 'Toprak nem oranını anlık ölçerek debiyi hidro-basınçla ayarlayan sulama tescili.',
        owner: 'Yılmaz AR-GE Ltd.',
        ipc: 'A (Tarım)',
        price: '500.000 TL',
        default_score: 0.764,
        match_pct: 76.4,
        rationale: 'Tencent Hy3 GGUF Vektör Analizi: Sulama ve nem sensörleri metniyle %76.4 vektörel uyum.'
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('ai_match'); // ai_match | escrow | architecture
      const [problemQueryInput, setProblemQueryInput] = useState('Beton dayanıklılığını ve basınç mukavemetini artıran nano kimyasal formül');
      const [isSearching, setIsSearching] = useState(false);
      const [matchResults, setMatchResults] = useState(SAMPLE_PATENTS);

      const handleAiSearch = (e) => {
        e.preventDefault();
        if (!problemQueryInput.trim()) return;
        setIsSearching(true);

        setTimeout(() => {
          setIsSearching(false);
          // Simüle edilmiş GGUF + pgvector HNSW araması
          const q = problemQueryInput.toLowerCase();
          const updated = SAMPLE_PATENTS.map(p => {
            let score = p.default_score;
            if (q.includes('beton') && p.id === 'pat_004') score = 0.968;
            if (q.includes('şarj') || q.includes('batarya')) {
              if (p.id === 'pat_005') score = 0.954;
              if (p.id === 'pat_004') score = 0.420;
            }
            return {
              ...p,
              default_score: score,
              match_pct: Math.round(score * 1000) / 10,
              rationale: `Tencent Hy3 GGUF Vektör Analizi: "${problemQueryInput.substring(0, 35)}..." metni ile %${Math.round(score * 1000) / 10} kosinüs benzerliği.`
            };
          }).sort((a, b) => b.default_score - a.default_score);

          setMatchResults(updated);
        }, 600);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* HEADER BAR */}
          <div className="bg-slate-900 text-slate-300 text-xs px-4 py-2 border-b border-slate-800 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span className="font-semibold text-white">AWS EC2 Odysseus GGUF Engine:</span>
              <span className="text-slate-400">Veriler Sunucu İçinde Kalır (Dış API Bağımsızlığı) + PostgreSQL pgvector HNSW</span>
            </div>
            <div className="text-slate-400 font-mono text-[11px]">Vector Dim: 1536 | Index: HNSW</div>
          </div>

          {/* NAVBAR */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div onClick={() => setActiveTab('ai_match')} className="flex items-center space-x-3 cursor-pointer">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-slate-900 to-brand-700 flex items-center justify-center text-white shadow-md">
                  <Icon name="cpu" className="w-6 h-6" />
                </div>
                <div>
                  <span className="font-display text-xl font-bold tracking-tight text-slate-900">
                    PATENT<span className="text-brand-600">PAZARI</span> <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">GGUF AI MOTORU</span>
                  </span>
                  <span className="block text-[10px] text-slate-500 font-medium uppercase">
                    Self-Hosted Tencent Hy3 GGUF & pgvector Kosinüs Benzerliği
                  </span>
                </div>
              </div>

              <nav className="flex items-center space-x-2 text-xs">
                <button
                  onClick={() => setActiveTab('ai_match')}
                  className={`px-3.5 py-2 rounded-lg font-bold flex items-center gap-1.5 ${
                    activeTab === 'ai_match' ? 'bg-brand-50 text-brand-600' : 'text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  <Icon name="sparkles" className="w-4 h-4 text-brand-600" />
                  <span>Akıllı Eşleştirme (AI)</span>
                </button>

                <button
                  onClick={() => setActiveTab('architecture')}
                  className={`px-3.5 py-2 rounded-lg font-bold flex items-center gap-1.5 ${
                    activeTab === 'architecture' ? 'bg-brand-50 text-brand-600' : 'text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  <Icon name="database" className="w-4 h-4 text-emerald-600" />
                  <span>Mimarisi & HNSW İndeks</span>
                </button>
              </nav>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl mx-auto px-4 py-8 w-full">
            
            {activeTab === 'ai_match' && (
              <div className="space-y-8">
                
                {/* HERO AI QUERY SECTION */}
                <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-brand-900 text-white rounded-3xl p-8 shadow-xl space-y-6">
                  <div className="space-y-2 max-w-2xl">
                    <div className="inline-flex items-center space-x-2 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full text-xs font-bold">
                      <Icon name="cpu" className="w-4 h-4" />
                      <span>AWS EC2 Sunucusunda Koşan GGUF Dil Modeli</span>
                    </div>
                    <h1 className="font-display text-3xl font-extrabold tracking-tight">
                      Yapay Zeka İle Anlamsal Patent Eşleştirme
                    </h1>
                    <p className="text-slate-300 text-xs leading-relaxed">
                      Alıcının teknik problemini kelimesi kelimesine aramak yerine, GGUF modelimizle 1536 boyutlu anlamsal vektöre çevirir ve PostgreSQL pgvector HNSW indeksi ile saniyeler içinde % uyum skoru veririz.
                    </p>
                  </div>

                  <form onSubmit={handleAiSearch} className="space-y-3">
                    <div className="flex gap-3">
                      <input
                        type="text"
                        value={problemQueryInput}
                        onChange={(e) => setProblemQueryInput(e.target.value)}
                        placeholder="Örn: Beton dayanıklılığını C60 seviyesine çıkaran nano katkı formülü..."
                        className="flex-1 px-4 py-3.5 rounded-xl text-slate-900 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-brand-500 shadow"
                      />
                      <button
                        type="submit"
                        disabled={isSearching}
                        className="bg-brand-500 hover:bg-brand-600 text-white font-bold px-6 py-3.5 rounded-xl text-xs flex items-center gap-2 shadow transition-all"
                      >
                        {isSearching ? <Icon name="cpu" className="w-4 h-4 animate-spin" /> : <Icon name="sparkles" className="w-4 h-4" />}
                        <span>{isSearching ? 'Vektörleniyor...' : 'AI İle Eşleştir'}</span>
                      </button>
                    </div>

                    <div className="flex flex-wrap gap-2 text-[11px] text-slate-300">
                      <span className="text-slate-400">Hızlı Örnek Aramalar:</span>
                      <button type="button" onClick={() => setProblemQueryInput('Elektrikli araçlarda bataryayı soğutan mikro manifold')} className="underline hover:text-white">Batarya Soğutma</button>
                      <button type="button" onClick={() => setProblemQueryInput('Beton dayanıklılığını artıran nano silika katkısı')} className="underline hover:text-white">Nano Beton</button>
                      <button type="button" onClick={() => setProblemQueryInput('Toprak nem oranına göre sulama yapan akıllı vana')} className="underline hover:text-white">Sulama Vanası</button>
                    </div>
                  </form>
                </div>

                {/* MATCH RESULTS SECTION */}
                <div className="space-y-4">
                  <div className="flex justify-between items-center border-b pb-3 text-xs">
                    <h3 className="font-bold text-slate-900 text-base">
                      Kosinüs Benzerliği En Yüksek Patentler ({matchResults.length})
                    </h3>
                    <span className="bg-emerald-50 text-emerald-700 font-bold px-3 py-1 rounded-lg border border-emerald-200">
                      HNSW Index Kosinüs Eşiği: >= %50
                    </span>
                  </div>

                  <div className="grid gap-4">
                    {matchResults.map((item, idx) => (
                      <div key={item.id} className="bg-white rounded-2xl border border-slate-200 p-6 space-y-3 shadow-sm hover:shadow-md transition-all">
                        <div className="flex flex-wrap justify-between items-start gap-2 border-b pb-3">
                          <div>
                            <span className="font-mono text-xs text-slate-400 font-bold">{item.patent_number}</span>
                            <h4 className="font-bold text-slate-900 text-base mt-0.5">{item.title}</h4>
                            <div className="text-xs text-slate-500">{item.owner} • IPC: {item.ipc}</div>
                          </div>

                          {/* MATCH SCORE BADGE */}
                          <div className="text-right">
                            <div className="inline-flex items-center space-x-1.5 bg-emerald-50 text-emerald-800 border border-emerald-300 font-extrabold text-sm px-3.5 py-1 rounded-xl">
                              <Icon name="sparkles" className="w-4 h-4 text-emerald-600" />
                              <span>%{item.match_pct} AI Uyum</span>
                            </div>
                            <div className="text-[10px] text-slate-400 font-mono mt-1">Cos Score: {item.default_score}</div>
                          </div>
                        </div>

                        <p className="text-xs text-slate-700 leading-relaxed">{item.abstract}</p>

                        {/* AI RATIONALE BANNER */}
                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 flex items-start gap-2">
                          <Icon name="cpu" className="w-4 h-4 text-brand-600 mt-0.5 shrink-0" />
                          <div>
                            <strong className="text-slate-900 block font-semibold mb-0.5">GGUF Vektör Eşleşme Gerekçesi:</strong>
                            <span className="text-slate-600 leading-relaxed">{item.rationale}</span>
                          </div>
                        </div>

                        <div className="pt-2 flex justify-between items-center text-xs">
                          <span className="font-extrabold text-brand-700">Beklenen Lisans/Devir: {item.price}</span>
                          <button onClick={() => alert('Görüşme talebi satıcıya iletildi.')} className="bg-brand-600 hover:bg-brand-700 text-white font-bold px-4 py-2 rounded-xl shadow">
                            İletişime Geç
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

            {/* TAB 2: ARCHITECTURE & HNSW INDEX DETAILS */}
            {activeTab === 'architecture' && (
              <div className="max-w-4xl mx-auto space-y-6 text-xs leading-relaxed text-slate-700">
                <div className="border-b pb-4">
                  <h1 className="font-display text-2xl font-bold text-slate-900">GGUF & pgvector HNSW Mimarisi</h1>
                  <p className="text-slate-500">Dış API'lere bağımlı kalmadan AWS EC2 üzerinde lokal vektör üretimi ve pgvector indeksi.</p>
                </div>

                <div className="bg-slate-900 text-slate-200 p-6 rounded-2xl space-y-4">
                  <h3 className="font-bold text-white text-sm">1. RAM Yönetimi & Singleton Pattern</h3>
                  <p>
                    `llama-cpp-python` kütüphanesi RAM sızıntısını önlemek için Singleton kalıbıyla yazılmıştır. `n_ctx=2048`, `n_batch=512` ve `n_threads=4` parametreleri ile model RAM'e sadece 1 kez yüklenir.
                  </p>

                  <h3 className="font-bold text-white text-sm pt-2 border-t border-slate-800">2. pgvector HNSW İndeks Stratejisi</h3>
                  <pre className="bg-slate-950 p-4 rounded-xl text-emerald-400 font-mono text-[11px] overflow-x-auto">
{`CREATE INDEX idx_patents_hnsw_embedding 
ON patents USING hnsw (embedding vector_cosine_ops) 
WITH (m = 16, ef_construction = 64);`}
                  </pre>
                  <p>
                    Kosinüs mesafesi için `vector_cosine_ops` kullanılır. Sorgu anında `SET LOCAL hnsw.ef_search = 100;` yapılarak hassasiyet artırılır.
                  </p>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 flex justify-between items-center">
              <span>&copy; {new Date().getFullYear()} Patent Pazarı AI Engine. Self-Hosted GGUF & pgvector.</span>
              <span>AWS EC2 Odysseus Infrastructure</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
