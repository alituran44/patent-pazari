                        <span className="font-semibold text-brand-700 group-hover:underline">
                          + {cat.name}
                        </span>
                        <span className="font-mono text-slate-400 text-[11px] font-bold">
                          ({cat.count})
                        </span>
                      </div>
                    ))}
                  </div>

                  <div className="pt-2 flex gap-4 text-xs font-bold text-brand-600">
                    <button onClick={() => setSelectedIpcFilter('')} className="hover:underline">+ All patent listings ({NEWLY_LISTED_PATENTS.length})</button>
                    <button onClick={() => setActiveTab('home')} className="hover:underline">+ All patent listings with pictures</button>
                  </div>
                </div>

                {/* 4. FREE TEXT SEARCH BOX (PatentAuction Prominent Search) */}
                <div className="bg-slate-100 p-6 rounded-xl border border-slate-300 shadow-inner space-y-3">
                  <h3 className="font-display font-extrabold text-base text-slate-900">
                    Free text search
                  </h3>

                  <div className="flex flex-col sm:flex-row gap-3">
                    <input
                      type="text"
                      value={searchText}
                      onChange={(e) => setSearchText(e.target.value)}
                      placeholder="Enter patent title, IPC code, or keyword..."
                      className="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white"
                    />

                    <button className="bg-slate-800 hover:bg-slate-900 text-white font-bold px-6 py-2.5 rounded-lg text-xs uppercase tracking-wider shadow">
                      SEARCH FOR PATENTS
                    </button>
                  </div>

                  <div className="flex items-center gap-4 text-xs text-slate-600 font-semibold">
                    <label className="flex items-center gap-1 cursor-pointer">
                      <input type="radio" name="search_target" checked={searchTarget === 'title'} onChange={() => setSearchTarget('title')} />
                      <span>Title only</span>
                    </label>
                    <label className="flex items-center gap-1 cursor-pointer">
                      <input type="radio" name="search_target" checked={searchTarget === 'all'} onChange={() => setSearchTarget('all')} />
                      <span>All contents</span>
                    </label>
                  </div>
                </div>

                {/* 5. NEWLY LISTED PATENTS (Ranked List Format) */}
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                  <h2 className="font-display font-extrabold text-xl text-slate-900 border-b pb-2">
                    Newly listed patents
                  </h2>

                  <div className="divide-y text-xs">
                    {NEWLY_LISTED_PATENTS.map((item, idx) => (
                      <div key={item.id} className="py-2.5 flex items-center justify-between gap-4 hover:bg-slate-50 px-2 rounded">
                        <div className="flex items-start gap-3">
                          <span className="font-mono text-slate-400 font-bold w-5">{idx + 1}.</span>
                          <div>
                            <span onClick={() => setSelectedPatentDetail(item)} className="font-bold text-brand-700 cursor-pointer hover:underline">
                              {item.title}
                            </span>
                            <div className="text-[11px] text-slate-400 font-mono mt-0.5">{item.patent_no} • IPC {item.ipc}</div>
                          </div>
                        </div>

                        <div className="text-right text-[11px] text-slate-400 shrink-0">
                          <div>{item.age}</div>
                          <div className="text-slate-500 font-semibold">{item.views} views</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 6. MOST VIEWED PATENTS (Ranked List Format) */}
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                  <h2 className="font-display font-extrabold text-xl text-slate-900 border-b pb-2">
                    Most viewed patents
                  </h2>

                  <div className="divide-y text-xs">
                    {MOST_VIEWED_PATENTS.map((item, idx) => (
                      <div key={item.id} className="py-2.5 flex items-center justify-between gap-4 hover:bg-slate-50 px-2 rounded">
                        <div className="flex items-start gap-3">
                          <span className="font-mono text-slate-400 font-bold w-5">{idx + 1}.</span>
                          <div>
                            <span onClick={() => setSelectedPatentDetail(item)} className="font-bold text-brand-700 cursor-pointer hover:underline">
                              {item.title}
                            </span>
                            <div className="text-[11px] text-slate-400 font-mono mt-0.5">{item.patent_no} • Top Ranked</div>
                          </div>
                        </div>

                        <div className="text-right text-[11px] text-slate-400 shrink-0">
                          <div className="font-bold text-brand-600">{item.views} total views</div>
                          <div>Listed {item.age}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 7. FAQ & INVENTOR RESOURCES FOOTER SECTION */}
                <div className="grid md:grid-cols-12 gap-6 bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-xs">
                  <div className="md:col-span-8 space-y-3 border-r pr-6">
                    <h3 className="font-display font-extrabold text-base text-slate-900 border-b pb-2">
                      Frequently Asked Questions
                    </h3>
                    <ul className="space-y-2 text-brand-700 font-semibold">
                      <li className="hover:underline cursor-pointer" onClick={() => setActiveTab('faq')}>+ Why list your patent on PatentPazari.com?</li>
                      <li className="hover:underline cursor-pointer" onClick={() => setActiveTab('faq')}>+ How much to list on PatentPazari.com? (First 2 Listings FREE)</li>
                      <li className="hover:underline cursor-pointer" onClick={() => setActiveTab('faq')}>+ What is a patent pending and how do I get listed?</li>
                      <li className="hover:underline cursor-pointer" onClick={() => setActiveTab('faq')}>+ How does Notary Escrow work under SMK 6769?</li>
                    </ul>
                  </div>

                  <div className="md:col-span-4 space-y-3">
                    <h3 className="font-display font-extrabold text-base text-slate-900 border-b pb-2">
                      Interesting books for inventors
                    </h3>
                    <div className="space-y-2 text-slate-600">
                      <div className="p-2.5 bg-slate-50 border rounded font-semibold text-slate-800">
                        📖 Patent Commercialization & Licensing Guide 2024
                      </div>
                      <div className="p-2.5 bg-slate-50 border rounded font-semibold text-slate-800">
                        📖 How to License Your Idea Without Spending Millions
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            )}

            {/* --- SCREEN 2: LIST YOUR PATENT --- */}
            {activeTab === 'list_patent' && (
              <div className="max-w-3xl mx-auto bg-white p-8 rounded-xl border border-slate-200 space-y-6 shadow-sm text-xs">
                <h1 className="font-display font-bold text-2xl text-slate-900 border-b pb-3">List Your Patent on PatentPazari.com</h1>
                <p className="text-slate-600">First 2 listings are completely FREE for individual inventors and TTOs.</p>

                <form onSubmit={(e) => { e.preventDefault(); alert('Patent ilanınız onaya gönderildi!'); setActiveTab('home'); }} className="space-y-4">
                  <div>
                    <label className="block font-bold mb-1">Invention / Patent Title *</label>
                    <input type="text" required placeholder="Örn: Toprak Nemi Sensörlü Vana" className="w-full p-2.5 border rounded-lg" />
                  </div>

                  <div className="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-bold mb-1">IPC Section *</label>
                      <select required className="w-full p-2.5 border rounded-lg bg-white">
                        {IPC_CATEGORIES_WITH_COUNTS.map(c => <option key={c.code} value={c.code}>{c.name_tr}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold mb-1">TÜRKPATENT Registration No *</label>
                      <input type="text" required placeholder="TR 2024/01124 Y" className="w-full p-2.5 border rounded-lg font-mono" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold mb-1">Abstract & Technical Advantages *</label>
                    <textarea rows="4" required placeholder="Describe your invention..." className="w-full p-2.5 border rounded-lg"></textarea>
                  </div>

                  <button type="submit" className="w-full bg-brand-700 text-white font-bold py-3 rounded-lg text-sm shadow hover:bg-brand-800">
                    Submit Patent Listing
                  </button>
                </form>
              </div>
            )}

            {/* --- SCREEN 3: MY ACCOUNT / PANEL --- */}
            {activeTab === 'account' && (
              <div className="bg-white p-8 rounded-xl border border-slate-200 space-y-6 shadow-sm text-xs">
                <h1 className="font-display font-bold text-2xl text-slate-900 border-b pb-3">User Dashboard & Listings</h1>
                <div className="p-4 bg-slate-50 rounded-lg border space-y-1">
                  <div className="font-bold text-slate-900">{currentUser.name} ({currentUser.company})</div>
                  <div className="text-slate-500">Role: {currentUser.role.toUpperCase()} | Free Listings Left: {currentUser.free_left}</div>
                </div>
              </div>
            )}

            {/* --- SCREEN 4: ESCROW & FINTECH --- */}
            {activeTab === 'escrow' && (
              <div className="bg-white p-8 rounded-xl border border-slate-200 space-y-6 shadow-sm text-xs">
                <h1 className="font-display font-bold text-2xl text-slate-900 border-b pb-3 flex items-center gap-2">
                  <Icon name="lock" className="w-6 h-6 text-emerald-600" />
                  <span>Iyzico Escrow (Güvenli Havuz) & Noter Devri (%5 Komisyon)</span>
                </h1>
                <p className="text-slate-600 leading-relaxed">
                  Alıcının ödemesi Iyzico Alt-Üye İşyeri havuzunda bloke edilir. SMK 6769 Noter devri gerçekleştiğinde %5 platform komisyonu kesilir ve %95 net tutar satıcının IBAN hesabına otomatik aktarılır.
                </p>
              </div>
            )}

            {/* --- SCREEN 5: GGUF AI ENGINE --- */}
            {activeTab === 'ai_engine' && (
              <div className="bg-white p-8 rounded-xl border border-slate-200 space-y-6 shadow-sm text-xs">
                <h1 className="font-display font-bold text-2xl text-slate-900 border-b pb-3 flex items-center gap-2">
                  <Icon name="sparkles" className="w-6 h-6 text-brand-600" />
                  <span>Self-Hosted Tencent Hy3 GGUF & pgvector HNSW Engine</span>
                </h1>
                <p className="text-slate-600 leading-relaxed">
                  AWS EC2 Odysseus sunucumuzda çalışan GGUF modeli ile aradığınız teknoloji 1536-boyutlu vektör anlamsal kosinüs benzerliği üzerinden HNSW indeksi ile saniyeler içinde % uyum skoru verir.
                </p>
              </div>
            )}

            {/* --- SCREEN 6: PRICING --- */}
            {activeTab === 'pricing' && (
              <div className="bg-white p-8 rounded-xl border border-slate-200 space-y-6 shadow-sm text-xs">
                <h1 className="font-display font-bold text-2xl text-slate-900 border-b pb-3">Pricing Tiers</h1>
                <div className="grid md:grid-cols-4 gap-4">
                  <div className="p-4 border rounded-xl bg-slate-50 space-y-2">
                    <h3 className="font-bold text-slate-900">Starter</h3>
                    <div className="font-display font-bold text-xl text-brand-700">FREE</div>
                    <p className="text-slate-500">First 2 listings free</p>
                  </div>
                  <div className="p-4 border rounded-xl bg-slate-50 space-y-2 border-brand-500">
                    <h3 className="font-bold text-slate-900">Standard</h3>
                    <div className="font-display font-bold text-xl text-brand-700">499 TL / mo</div>
                    <p className="text-slate-500">Unlimited listings</p>
                  </div>
                  <div className="p-4 border rounded-xl bg-slate-50 space-y-2">
                    <h3 className="font-bold text-slate-900">Featured</h3>
                    <div className="font-display font-bold text-xl text-brand-700">299 TL / listing</div>
                    <p className="text-slate-500">Top placement 30 days</p>
                  </div>
                  <div className="p-4 border rounded-xl bg-slate-50 space-y-2">
                    <h3 className="font-bold text-slate-900">Enterprise</h3>
                    <div className="font-display font-bold text-xl text-brand-700">9.999 TL / yr</div>
                    <p className="text-slate-500">Verified TTO badge</p>
                  </div>
                </div>
              </div>
            )}

            {/* --- SCREEN 7: HELP & FAQ --- */}
            {activeTab === 'faq' && (
              <div className="bg-white p-8 rounded-xl border border-slate-200 space-y-6 shadow-sm text-xs leading-relaxed">
                <h1 className="font-display font-bold text-2xl text-slate-900 border-b pb-3">Help & Frequently Asked Questions</h1>
                <div className="space-y-4">
                  <div>
                    <h3 className="font-bold text-sm text-slate-900">Why list your patent on PatentPazari.com?</h3>
                    <p className="text-slate-600">We connect inventors directly with buyers, corporations, and investors in Türkiye.</p>
                  </div>
                  <div>
                    <h3 className="font-bold text-sm text-slate-900">How much to list?</h3>
                    <p className="text-slate-600">Individual inventors get their first 2 listings completely FREE.</p>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* DETAIL MODAL */}
          {selectedPatentDetail && (
            <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4 text-xs">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="font-mono text-slate-400 font-bold">{selectedPatentDetail.patent_no}</span>
                    <h3 className="font-bold text-base text-slate-900 mt-0.5">{selectedPatentDetail.title}</h3>
                  </div>
                  <button onClick={() => setSelectedPatentDetail(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                <p className="text-slate-700 leading-relaxed">{selectedPatentDetail.abstract}</p>
                <div className="flex justify-end gap-2 border-t pt-3">
                  <button onClick={() => setSelectedPatentDetail(null)} className="px-4 py-2 border rounded-lg">Close</button>
                  <button onClick={() => { setSelectedPatentDetail(null); setActiveTab('escrow'); }} className="px-4 py-2 bg-brand-700 text-white font-bold rounded-lg">Escrow Buy & License</button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER BAR (PatentAuction Style Links) */}
          <footer className="bg-white border-t border-slate-300 py-6 text-xs text-slate-600">
            <div className="max-w-6xl mx-auto px-4 text-center space-y-3">
              <div className="flex flex-wrap justify-center gap-4 font-semibold text-brand-700">
                <button onClick={() => setActiveTab('home')} className="hover:underline">Home</button> |
                <button onClick={() => setActiveTab('list_patent')} className="hover:underline">List a patent</button> |
                <button onClick={() => setActiveTab('account')} className="hover:underline">Manage your account</button> |
                <button onClick={() => setActiveTab('faq')} className="hover:underline">FAQ & Terms of use</button> |
                <button onClick={() => setActiveTab('faq')} className="hover:underline">Contact us</button>
              </div>

              <div className="text-[11px] text-slate-400 font-mono">
                Copyright &copy; {new Date().getFullYear()} PatentPazari.com. All rights reserved.<br />
                Page generated in 0.012s. PatentPazari Time.
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
